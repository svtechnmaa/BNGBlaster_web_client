igmp:
  autostart:
    __datatype: bool
    __label: igmp/autostart
    __options:
    - true
    - false
    __value: true
    __widget: selectbox
  group:
    __datatype: str
    __label: igmp/group
    __options: []
    __value: 225.10.10.1
    __widget: text_input
  group-count:
    __datatype: int
    __label: igmp/group-count
    __options: []
    __value: 2
    __widget: text_input
  group-iter:
    __datatype: str
    __label: igmp/group-iter
    __options: []
    __value: 0.0.0.1
    __widget: text_input
  version:
    __datatype: str
    __label: igmp/version
    __options:
    - '1'
    - '2'
    - '3'
    __value: 2
    __widget: selectbox
  zapping-count:
    __datatype: int
    __label: igmp/zapping-count
    __options: []
    __value: 1000
    __widget: text_input
  zapping-interval:
    __datatype: int
    __label: igmp/zapping-interval
    __options: []
    __value: 5
    __widget: text_input
interfaces:
  access:
  - address:
      __datatype: str
      __label: interfaces/access/address
      __options: []
      __value: 172.10.10.2
      __widget: text_input
    gateway:
      __datatype: str
      __label: interfaces/access/gateway
      __options: []
      __value: 172.10.10.1
      __widget: text_input
    interface:
      __datatype: interface_auto
      __label: interfaces/access/interface
      __options: []
      __value: ens16.366
      __widget: text_input
    ipv6:
      __datatype: bool
      __label: interfaces/access/ipv6
      __options:
      - true
      - false
      __value: false
      __widget: selectbox
    stream-group-id:
      __datatype: int
      __label: interfaces/access/stream-group-id
      __options:
        __max: 65535
        __min: 0
        __step: 1000
      __value: 1
      __widget: number_input
    type:
      __datatype: str
      __label: interfaces/access/type
      __options:
      - pppoe
      - ipoe
      __value: ipoe
      __widget: selectbox
sessions:
  count:
    __datatype: str
    __label: sessions/count
    __options: []
    __value: 1
    __widget: text_input
