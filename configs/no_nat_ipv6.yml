dhcpv6:
  enable:
    __datatype: bool
    __label: dhcpv6/enable
    __options:
    - true
    - false
    __value: true
    __widget: selectbox
interfaces:
  access:
  - interface:
      __datatype: interface_auto
      __label: interfaces/access/interface
      __options: []
      __value: ens17.61
      __widget: text_input
    ipv6:
      __datatype: bool
      __label: interfaces/access/ipv6
      __options:
      - true
      - false
      __value: true
      __widget: selectbox
    stream-group-id:
      __datatype: int
      __label: interfaces/access/stream-group-id
      __options:
        __max: 65535
        __min: 0
        __step: 1000
      __value: 101
      __widget: number_input
    type:
      __datatype: str
      __label: interfaces/access/type
      __options:
      - pppoe
      - ipoe
      __value: ipoe
      __widget: selectbox
    vlan-mode:
      __datatype: str
      __label: interfaces/access/vlan-mode
      __options:
      - '1:1'
      - N:1
      __value: N:1
      __widget: selectbox
  network:
  - address-ipv6:
      __datatype: str
      __label: interfaces/network/address-ipv6
      __options: []
      __value: 2002:db8:61::2/48
      __widget: text_input
    gateway-ipv6:
      __datatype: str
      __label: interfaces/network/gateway-ipv6
      __options: []
      __value: 2002:db8:61::1
      __widget: text_input
    interface:
      __datatype: interface_auto
      __label: interfaces/network/interface
      __options: []
      __value: ens16.60
      __widget: text_input
sessions:
  count:
    __datatype: str
    __label: sessions/count
    __options: []
    __value: 1000
    __widget: text_input
streams:
- direction:
    __datatype: str
    __label: streams/direction
    __options:
    - both
    - upstream
    - downstream
    __value: both
    __widget: selectbox
  length:
    __datatype: int
    __label: streams/length
    __options:
      __max: 9000
      __min: 76
      __step: 100
    __value: 1000
    __widget: number_input
  name:
    __datatype: str
    __label: streams/name
    __options: []
    __value: BestEffort-v6
    __widget: text_input
  pps:
    __datatype: str
    __label: streams/pps
    __options: []
    __value: 100000
    __widget: text_input
  stream-group-id:
    __datatype: str
    __label: streams/stream-group-id
    __options: []
    __value: 101
    __widget: text_input
  type:
    __datatype: str
    __label: streams/type
    __options:
    - ipv4
    - ipv6
    - ipv6pd
    __value: ipv6
    __widget: selectbox
